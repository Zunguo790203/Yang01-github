<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>钻井液 ECD / 井眼清洁 / 岩屑运移计算平台</title>
  <style>
    :root {
      --bg: #f2f6fb;
      --panel: #ffffff;
      --soft: #edf4ff;
      --title: #0d2b4f;
      --text: #1f2d3d;
      --muted: #66768a;
      --blue: #2563eb;
      --green: #0f9d58;
      --amber: #f59e0b;
      --red: #dc2626;
      --border: #dfe8f3;
      --shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    body { min-height: 100vh; }
    .container {
      max-width: 1320px;
      margin: 24px auto;
      padding: 0 16px 40px;
    }
    .header {
      background: linear-gradient(135deg, #0d2b4f, #1d4f91);
      color: white;
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 22px 24px;
      margin-bottom: 20px;
    }
    .header h1 { margin: 0 0 8px; font-size: 30px; }
    .header p { margin: 0; color: rgba(255,255,255,0.82); }
    .layout {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 20px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 18px 20px;
    }
    .card h2 {
      margin: 0 0 16px;
      color: var(--title);
      font-size: 20px;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    button {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.15s ease;
    }
    button:hover { transform: translateY(-1px); }
    .primary { background: var(--blue); color: white; }
    .secondary { background: var(--soft); color: var(--title); border: 1px solid var(--border); }
    .danger { background: #fff1f2; color: var(--red); border: 1px solid #fecdd3; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(160px, 1fr));
      gap: 12px 16px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field label {
      font-size: 12px;
      color: var(--muted);
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font-size: 14px;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: 2px solid rgba(37,99,235,0.12);
      border-color: var(--blue);
    }
    .section-title {
      margin: 16px 0 10px;
      font-size: 15px;
      font-weight: 700;
      color: var(--title);
    }
    .hint {
      background: #f7f9ff;
      border: 1px solid var(--border);
      border-left: 4px solid var(--blue);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.7;
      color: var(--text);
      margin-top: 12px;
    }
    .result-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }
    .stat {
      background: linear-gradient(180deg, #f8fbff, #eff6ff);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .stat .k {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .stat .v {
      font-size: 27px;
      font-weight: 700;
      color: var(--title);
      line-height: 1.1;
    }
    .ok { color: var(--green); }
    .warn { color: var(--amber); }
    .danger { color: var(--red); }
    .note {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.7;
      color: var(--text);
      margin-top: 12px;
    }
    .chart-panel {
      margin-top: 18px;
      background: #f8fbff;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 10px;
    }
    canvas {
      width: 100%;
      height: 240px;
      display: block;
      border-radius: 8px;
      background: linear-gradient(180deg, #ffffff, #eef7ff);
    }
    .csv-box {
      margin-top: 12px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 10px;
      background: #fafcff;
    }
    .csv-box input[type="file"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      padding: 10px;
    }
    .tbl {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 12px;
    }
    .tbl th, .tbl td {
      border: 1px solid var(--border);
      padding: 8px 6px;
      text-align: center;
    }
    .tbl th { background: #f0f7ff; color: var(--title); }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .grid, .result-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="container">
  <header class="header">
    <h1>钻井液 ECD / 井眼清洁 / 岩屑运移计算平台</h1>
    <p>现场辅助计算，适用于钻井液、井眼清洁、切屑运移和截面流动趋势判断。</p>
  </header>

  <div class="layout">
    <div class="card">
      <h2>1. 现场数据录入</h2>
      <div class="toolbar">
        <button class="primary" id="calcBtn">计算</button>
        <button class="secondary" id="loadSampleBtn">加载样例</button>
        <button class="secondary" id="loadCSVBtn">导入 CSV</button>
      </div>

      <div class="section-title">井身结构与泥浆</div>
      <div class="grid">
        <div class="field"><label>井名</label><input id="wellName" value="安页22-2HF" /></div>
        <div class="field"><label>当前井深（m）</label><input id="wellDepth" value="5293.3" /></div>
        <div class="field"><label>套管下深（m）</label><input id="casingDepth" value="2490" /></div>
        <div class="field"><label>上层套管内径（mm）</label><input id="casingID" value="220.5" /></div>
        <div class="field"><label>裸眼井径（mm）</label><input id="holeID" value="226" /></div>
        <div class="field"><label>钻柱外径（mm）</label><input id="pipeOD" value="127" /></div>
        <div class="field"><label>钻柱内径（mm）</label><input id="pipeID" value="108.6" /></div>
        <div class="field"><label>钻井液密度（g/cm³）</label><input id="mudDensity" value="1.75" /></div>
        <div class="field"><label>漏斗黏度（s）</label><input id="funnelVisc" value="82" /></div>
        <div class="field"><label>塑性黏度 PV（mPa·s）</label><input id="pv" value="49" /></div>
        <div class="field"><label>动切力 YP（Pa）</label><input id="yp" value="12" /></div>
        <div class="field"><label>初切（Pa）</label><input id="gel10" value="5.5" /></div>
        <div class="field"><label>终切（Pa）</label><input id="gel30" value="12" /></div>
      </div>

      <div class="section-title">工况参数</div>
      <div class="grid">
        <div class="field"><label>排量（L/s）</label><input id="flowRate" value="24.1" /></div>
        <div class="field"><label>转速（rpm）</label><input id="rpm" value="64" /></div>
        <div class="field"><label>钻速（min/m）</label><input id="rop" value="1.9" /></div>
        <div class="field"><label>立压（MPa）</label><input id="standpipe" value="37.43" /></div>
        <div class="field"><label>井底循环温度（℃）</label><input id="tempBottom" value="117" /></div>
        <div class="field"><label>岩屑粒径（mm）</label><input id="cutSize" value="10" /></div>
        <div class="field"><label>岩屑密度（g/cm³）</label><input id="cutDensity" value="2.65" /></div>
        <div class="field"><label>数据来源</label>
          <select id="sourceType">
            <option value="实时录井">实时录井</option>
            <option value="现场工况表">现场工况表</option>
            <option value="实验室数据">实验室数据</option>
            <option value="历史工况">历史工况</option>
          </select>
        </div>
      </div>

      <div class="section-title">CSV / 测斜数据导入</div>
      <div class="csv-box">
        <input type="file" id="csvFile" accept=".csv,text/csv" />
        <div class="hint" id="csvHint">支持 3 列 CSV：MD, 井斜, 方位。也可使用钻具组合 CSV。</div>
      </div>
      <div id="csvTableContainer"></div>
    </div>

    <div class="card">
      <h2>2. 计算结果</h2>
      <div class="result-grid">
        <div class="stat">
          <span class="k">估算井底 ECD</span>
          <span class="v" id="ecdVal">--</span>
        </div>
        <div class="stat">
          <span class="k">环空流速</span>
          <span class="v" id="annularVelocity">--</span>
        </div>
        <div class="stat">
          <span class="k">岩屑运移指数</span>
          <span class="v" id="transportIndex">--</span>
        </div>
        <div class="stat">
          <span class="k">井底清洁风险</span>
          <span class="v" id="cleanRisk">--</span>
        </div>
      </div>

      <div class="note" id="summaryBox">
        尚未计算，先录入现场参数并点击“计算”。
      </div>

      <div class="chart-panel">
        <canvas id="profileChart" width="760" height="240"></canvas>
      </div>

      <div class="hint">
        说明：本计算器采用简化工程模型，适合现场快速评估、趋势判断和技术会议讨论。它不能替代正式井下压力软件、压井程序、井漏预警系统或现场责任人的审核结论。
      </div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('profileChart');
  const ctx = canvas.getContext('2d');

  function toNumber(id, fallback = 0) {
    const val = document.getElementById(id).value;
    const n = Number(val);
    return Number.isFinite(n) ? n : fallback;
  }

  function clamp(value, min, max) {
    return Math.min(Math.max(value, min), max);
  }

  function calcAnnulusArea(innerDiamMm, outerDiamMm) {
    const inner = innerDiamMm / 1000;
    const outer = outerDiamMm / 1000;
    return (Math.PI / 4) * (outer * outer - inner * inner);
  }

  function calcEcdSimplified(mudDensity, flowRate, annulusArea, depthM, standpipeMPa, pv, yp, tempBottom) {
    const area = Math.max(annulusArea, 1e-6);
    const velocity = flowRate / area; // L/s => m³/s / area(m²) => m/s
    const rhoValue = mudDensity * 1000;
    const depthFactor = Math.max(depthM, 1);
    const hydraulicLoss = 0.00018 * Math.pow(flowRate, 1.7) * (pv + 0.5 * yp) * depthFactor / Math.pow(area * 1000, 1.2);
    const densityEquivalent = hydraulicLoss / (0.00981 * depthFactor || 1);
    const tempFactor = 1 + (tempBottom - 65) * 0.00055;
    const ecdSg = mudDensity + densityEquivalent * tempFactor;
    const ecdMPa = (rhoValue * 9.81 * depthFactor / 1e6) + (standpipeMPa * 0.18) + hydraulicLoss;
    return { velocity, hydraulicLoss, densityEquivalent, ecdSg, ecdMPa };
  }

  function calcTransportIndex(flowRate, annulusArea, cutSizeMm, cutDensity, mudDensity, rop) {
    const area = Math.max(annulusArea, 1e-6);
    const velocity = flowRate / area;
    const densityDelta = Math.max(cutDensity - mudDensity, 0.05);
    const slipVelocity = 0.063 * Math.sqrt(densityDelta * cutSizeMm);
    const transportIndex = velocity / (slipVelocity + 0.08 + (rop * 0.02));
    const riskScore = clamp(1.6 - transportIndex, 0, 1.3);
    return { velocity, slipVelocity, transportIndex, riskScore };
  }

  function getRiskText(index) {
    if (index > 1.3) return { text: '良好', cls: 'ok' };
    if (index > 0.9) return { text: '中等', cls: 'warn' };
    return { text: '偏危险', cls: 'danger' };
  }

  function parseCsvText(text) {
    const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
    const rows = lines.map(line => {
      const cells = line.split(',').map(v => v.trim().replace(/^"|"$/g, ''));
      return cells;
    }).filter(row => row.length > 0);
    return rows;
  }

  function renderCsvTable(rows) {
    const container = document.getElementById('csvTableContainer');
    if (!rows || rows.length === 0) {
      container.innerHTML = '<div class="hint">未读取到有效 CSV 数据。</div>';
      return;
    }
    const head = rows[0];
    const dataBody = rows.slice(1, 8);
    let html = '<table class="tbl"><thead><tr>' + head.map(h => '<th>' + (h || '') + '</th>').join('') + '</tr></thead><tbody>';
    dataBody.forEach(row => {
      html += '<tr>' + row.map(v => '<td>' + (v || '') + '</td>').join('') + '</tr>';
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  }

  function drawChart(ecdValue, transportValue) {
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    const pad = { left: 40, top: 20, right: 20, bottom: 30 };
    const plotW = w - pad.left - pad.right;
    const plotH = h - pad.top - pad.bottom;

    ctx.strokeStyle = '#dfe8f3';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 5; i++) {
      const y = pad.top + (plotH / 5) * i;
      ctx.beginPath();
      ctx.moveTo(pad.left, y);
      ctx.lineTo(w - pad.right, y);
      ctx.stroke();
    }

    for (let i = 0; i <= 5; i++) {
      const x = pad.left + (plotW / 5) * i;
      ctx.beginPath();
      ctx.moveTo(x, pad.top);
      ctx.lineTo(x, h - pad.bottom);
      ctx.stroke();
    }

    ctx.fillStyle = '#66768a';
    ctx.font = '12px Microsoft YaHei';
    ctx.fillText('井深', w / 2 - 15, h - 6);
    ctx.save();
    ctx.translate(12, h / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('ECD / 风险指数', 0, 0);
    ctx.restore();

    const maxDepth = Math.max(parseFloat(document.getElementById('wellDepth').value) || 5000, 2000);
    const dataPoints = Array.from({ length: 8 }, (_, i) => {
      const t = i / 7;
      const depth = maxDepth * t;
      const ecd = 1.5 + (ecdValue || 1.7) * 0.18 * (1 + Math.sin(t * Math.PI * 1.6) * 0.25);
      const risk = transportValue ? (0.4 + transportValue * 0.7 * (1 - t * 0.5)) : 0.8;
      return { depth, ecd, risk };
    });

    // ECD 曲线
    ctx.beginPath();
    dataPoints.forEach((p, idx) => {
      const x = pad.left + (p.depth / maxDepth) * plotW;
      const y = h - pad.bottom - ((p.ecd - 1.2) / (2.4 - 1.2)) * plotH;
      if (idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = '#2563eb';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // 风险曲线
    ctx.beginPath();
    dataPoints.forEach((p, idx) => {
      const x = pad.left + (p.depth / maxDepth) * plotW;
      const y = h - pad.bottom - ((p.risk - 0.2) / (1.6 - 0.2)) * plotH;
      if (idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#2563eb';
    ctx.fillText('ECD', pad.left + 8, pad.top + 14);
    ctx.fillStyle = '#f59e0b';
    ctx.fillText('清洁风险', pad.left + 90, pad.top + 14);
  }

  function calculate() {
    const depthM = toNumber('wellDepth', 5293.3);
    const casingDepth = toNumber('casingDepth', 2490);
    const casingIDmm = toNumber('casingID', 220.5);
    const holeIDmm = toNumber('holeID', 226);
    const pipeODmm = toNumber('pipeOD', 127);
    const pipeIDmm = toNumber('pipeID', 108.6);
    const mudDensity = toNumber('mudDensity', 1.75);
    const pv = toNumber('pv', 49);
    const yp = toNumber('yp', 12);
    const flowRate = toNumber('flowRate', 24.1);
    const rpm = toNumber('rpm', 64);
    const rop = toNumber('rop', 1.9);
    const standpipe = toNumber('standpipe', 37.43);
    const tempBottom = toNumber('tempBottom', 117);
    const cutSize = toNumber('cutSize', 10);
    const cutDensity = toNumber('cutDensity', 2.65);

    const activeAnnulus = (depthM > casingDepth)
      ? calcAnnulusArea(pipeODmm, holeIDmm)
      : calcAnnulusArea(pipeODmm, casingIDmm);

    const ecd = calcEcdSimplified(mudDensity, flowRate, activeAnnulus, depthM, standpipe, pv, yp, tempBottom);
    const transport = calcTransportIndex(flowRate, activeAnnulus, cutSize, cutDensity, mudDensity, rop);
    const risk = getRiskText(transport.transportIndex);

    document.getElementById('ecdVal').textContent = ecd.ecdSg.toFixed(2) + ' sg';
    document.getElementById('annularVelocity').textContent = ecd.velocity.toFixed(2) + ' m/s';
    document.getElementById('transportIndex').textContent = transport.transportIndex.toFixed(2);
    document.getElementById('cleanRisk').textContent = risk.text;
    document.getElementById('cleanRisk').className = 'v ' + risk.cls;

    drawChart(ecd.ecdSg, transport.transportIndex);

    const summary = [
      '井名：' + (document.getElementById('wellName').value || '未命名井'),
      '数据来源：' + document.getElementById('sourceType').value,
      '估算井底 ECD：' + ecd.ecdSg.toFixed(2) + ' sg',
      '环空流速：' + ecd.velocity.toFixed(2) + ' m/s',
      '岩屑运移指数：' + transport.transportIndex.toFixed(2),
      '清洁风险：' + risk.text,
      '说明：简化模型适用于现场趋势判断，不能代替正式��底压力和井控软件。'
    ].join('<br>');

    document.getElementById('summaryBox').innerHTML = summary;
  }

  function loadSample() {
    document.getElementById('wellName').value = '安页22-2HF';
    document.getElementById('wellDepth').value = '5293.3';
    document.getElementById('casingDepth').value = '2490';
    document.getElementById('casingID').value = '220.5';
    document.getElementById('holeID').value = '226';
    document.getElementById('pipeOD').value = '127';
    document.getElementById('pipeID').value = '108.6';
    document.getElementById('mudDensity').value = '1.75';
    document.getElementById('funnelVisc').value = '82';
    document.getElementById('pv').value = '49';
    document.getElementById('yp').value = '12';
    document.getElementById('flowRate').value = '24.1';
    document.getElementById('rpm').value = '64';
    document.getElementById('rop').value = '1.9';
    document.getElementById('standpipe').value = '37.43';
    document.getElementById('tempBottom').value = '117';
    document.getElementById('cutSize').value = '10';
    document.getElementById('cutDensity').value = '2.65';
    document.getElementById('sourceType').value = '实时录井';
    calculate();
  }

  function handleCsvImport(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (e) {
      const text = e.target.result;
      const rows = parseCsvText(text);
      renderCsvTable(rows);
      document.getElementById('csvHint').textContent = 'CSV 导入成功，已读取 ' + Math.max(rows.length - 1, 0) + ' 行数据。';
    };
    reader.readAsText(file);
  }

  document.getElementById('calcBtn').addEventListener('click', calculate);
  document.getElementById('loadSampleBtn').addEventListener('click', loadSample);
  document.getElementById('csvFile').addEventListener('change', handleCsvImport);
  document.getElementById('loadCSVBtn').addEventListener('click', () => {
    document.getElementById('csvFile').click();
  });

  loadSample();
</script>
</body>
</html>
